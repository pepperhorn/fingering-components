name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node verify.mjs
      - run: node build-preview.mjs
      - run: git diff --exit-code preview.html || (echo "preview.html is stale — run node build-preview.mjs" && exit 1)
